name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project and add app code
        run: |
          unzip -q screenshot_vault.zip
          flutter create --platforms=android --org com.example --project-name screenshot_vault_app app
          rm -rf app/lib app/test
          cp -r screenshot_vault/lib app/lib
          cd app
          flutter pub add sqflite path photo_manager google_mlkit_text_recognition intl workmanager
          python3 ../screenshot_vault/ci/patch_android.py

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Save APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-vault-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
