name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project and add app code
        run: |
          unzip -q screenshot_vault.zip
          flutter create --platforms=android --org com.example --project-name screenshot_vault_app app
          rm -rf app/lib app/test
          cp -r screenshot_vault/lib app/lib
          cd app
          flutter pub add sqflite path photo_manager google_mlkit_text_recognition intl workmanager

      - name: Patch Android permissions and minSdk
        working-directory: app
        run: |
          python3 - <<'PY'
          import re, pathlib

          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = m.read_text()
          perms = (
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
          )
          if 'READ_MEDIA_IMAGES' not in t:
              t = t.replace('<application', perms + '    <application', 1)
          m.write_text(t)

          for name in ('build.gradle.kts', 'build.gradle'):
              g = pathlib.Path('android/app') / name
              if g.exists():
                  s = g.read_text()
                  new = 'minSdk = 24' if name.endswith('kts') else 'minSdkVersion 24'
                  s = re.sub(r'minSdk(Version)?\s*=?\s*flutter\.minSdkVersion', new, s)
                  g.write_text(s)
          PY

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Save APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-vault-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
